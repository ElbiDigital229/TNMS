name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/TNMS
            git pull origin main
            npm install
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            pm2 restart tnms
            echo "Deployed successfully at $(date)"
