name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Ensure swap
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          sudo swapon --show
      - name: Deploy
        env:
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          set -e
          cd /home/ubuntu/TNMS
          git checkout -- .
          git clean -fd
          git pull origin main
          npm install

          # Write Firebase service account key
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/ubuntu/firebase-key.json
          chmod 600 /home/ubuntu/firebase-key.json

          # Ensure .env has the Firebase path
          grep -q "FIREBASE_SERVICE_ACCOUNT_PATH" .env 2>/dev/null || echo 'FIREBASE_SERVICE_ACCOUNT_PATH=/home/ubuntu/firebase-key.json' >> .env

          npx prisma migrate deploy
          npx prisma generate
          npm run build

          # Reload nginx (config is managed on-server with certbot SSL)
          sudo nginx -t && sudo systemctl reload nginx

          pm2 delete tnms 2>/dev/null || true
          pm2 start ecosystem.config.cjs

          sleep 3
          curl -sf http://localhost:3000/ > /dev/null && echo "Health check passed" || echo "Health check warning"
          echo "Deployed successfully at $(date)"
