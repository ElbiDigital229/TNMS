name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/TNMS
            git pull origin main
            npm install
            npx prisma migrate deploy
            npx prisma generate
            npm run build

            # Install nginx config if changed
            sudo cp nginx/tnms.conf /etc/nginx/sites-available/tnms
            sudo ln -sf /etc/nginx/sites-available/tnms /etc/nginx/sites-enabled/tnms
            sudo nginx -t && sudo systemctl reload nginx

            pm2 restart tnms || pm2 start ecosystem.config.cjs

            # Health check
            sleep 3
            curl -sf http://localhost:3000/api/auth/login > /dev/null && echo "Health check passed" || echo "Health check failed"
            echo "Deployed successfully at $(date)"
