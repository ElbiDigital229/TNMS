name: Server Shell (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - rebuild
      command:
        description: "Optional extra shell command to run after diagnose (read-only is safest)"
        required: false
        default: ""

jobs:
  shell:
    runs-on: self-hosted
    steps:
      - name: Diagnose
        run: |
          set +e
          echo "=== whoami / id ==="
          whoami; id
          echo ""
          echo "=== pwd / hostname ==="
          pwd; hostname
          echo ""
          echo "=== /home/ubuntu/TNMS tree (top level) ==="
          ls -la /home/ubuntu/TNMS 2>&1 | head -40
          echo ""
          echo "=== dist/public listing ==="
          ls -la /home/ubuntu/TNMS/dist/public 2>&1 | head -20
          echo ""
          echo "=== dist/public/assets first 30 by mtime ==="
          ls -lat /home/ubuntu/TNMS/dist/public/assets 2>&1 | head -30
          echo ""
          echo "=== dist/public/index.html (bundle hash referenced) ==="
          grep -oE 'index-[A-Za-z0-9_-]+\.js' /home/ubuntu/TNMS/dist/public/index.html 2>&1 | head -3
          echo ""
          echo "=== git status / HEAD ==="
          cd /home/ubuntu/TNMS
          git rev-parse HEAD 2>&1
          git log -1 --oneline 2>&1
          git status -s 2>&1 | head -20
          echo ""
          echo "=== pm2 list ==="
          pm2 list 2>&1 | head -40
          echo ""
          echo "=== nginx root from config ==="
          sudo nginx -T 2>/dev/null | grep -E "^\s*root\s" | head -3
          echo ""
          echo "=== free / df ==="
          free -h | head -3
          df -h /home /home/ubuntu/TNMS 2>&1 | head -5

      - name: Optional extra command
        if: ${{ inputs.command != '' }}
        run: |
          echo "=== Running custom command ==="
          set -e
          bash -c "${{ inputs.command }}"

      - name: Rebuild
        if: ${{ inputs.mode == 'rebuild' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=512"
        run: |
          set -e
          cd /home/ubuntu/TNMS
          echo "=== fetching origin/main ==="
          git fetch origin main
          git reset --hard origin/main
          # Note: not running 'git clean -fd' — keeps any non-tracked files safe.
          git log -1 --oneline

          echo "=== npm install ==="
          npm install

          echo "=== prisma ==="
          npx prisma migrate deploy
          npx prisma generate

          echo "=== build ==="
          npm run build

          echo "=== post-build dist/public/index.html bundle hash ==="
          grep -oE 'index-[A-Za-z0-9_-]+\.js' dist/public/index.html | head -3

          echo "=== pm2 restart ==="
          pm2 restart tnms || pm2 start ecosystem.config.cjs

          sleep 3
          curl -sf http://localhost:3000/ > /dev/null && echo "Health check passed" || echo "Health check warning"
          echo "Done at $(date)"
